<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echobend Go Live</title>
<link rel="icon" href="/brand/favicon.svg">
<link rel="stylesheet" href="/echobend.css">
</head>
<body>
<!--
  Staff "Go Live" console. This page sits behind Cloudflare Access
  (employees sign in with an @echobend.com address and an emailed one-time code),
  so only staff can reach it. The client page (/review/) stays public but password-gated.
-->
<div class="bar">
  <div class="left"><div class="brand"><span class="brand-logo" role="img" aria-label="Echobend"></span><small>Go Live</small></div></div>
  <div class="right"><span class="meta" id="who" hidden></span></div>
</div>
<section class="console">
  <aside>
    <h2>Start a review session</h2>
    <div class="field"><label for="proj">Project name</label><input id="proj" type="text" value="Acme Spring Spot v3"></div>
    <div class="field"><label for="pw">Client password</label>
      <div class="row"><input id="pw" type="text"><button class="btn small" id="regen" style="flex:0 0 auto">New</button></div></div>
    <div class="field"><label for="preset">Quality preset</label>
      <select id="preset">
        <option value="1080">1080p · H.264 · 12 Mbps (default)</option>
        <option value="4k">2160p · H.264 · 35 Mbps (fast connections only)</option>
        <option value="720">720p · H.264 · 5 Mbps (weak client internet)</option>
      </select></div>
    <p class="fine" style="margin-top:0">Pick <b>OBS Virtual Camera</b> as the camera, or use OBS's WHIP output (see setup notes).</p>
    <button class="btn btn-primary" id="go">Go live</button>
    <div style="height:22px"></div>
    <label>Send this to the client</label>
    <div class="linkbox" id="clientLink">Press "Go live" first.</div>
    <div class="row" style="margin-top:8px"><button class="btn small" id="copy">Copy link + password</button></div>
    <p class="fine">The link and password are separate on purpose. A forwarded link without the password shows nothing.</p>
  </aside>
  <div class="stage" id="stage"><div class="waiting" id="waiting">Your outgoing feed will preview here.</div></div>
</section>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const VDO_BASE = location.origin + "/";
  const q = new URLSearchParams(location.search);
  const extraWss = q.get("wss2") ? "&wss2=" + encodeURIComponent(q.get("wss2")) : "";
  const extraSrc = q.get("webcam") !== null ? "&webcam&autostart" : "";
  const rand = (n, set) => Array.from(crypto.getRandomValues(new Uint32Array(n)), x => set[x % set.length]).join("");
  const newPw = () => rand(12, "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789");
  $("pw").value = newPw();
  $("regen").onclick = () => { $("pw").value = newPw(); };
  // Exact &width/&height, matched to OBS's Virtual Camera output size. In testing, the soft
  // &quality=0 target silently fell back to 640x360; an exact size held for the whole session.
  // (An exact size OBS isn't outputting fails loudly with "Camera failed to load" instead.)
  const PRESETS = {
    "1080": "&width=1920&height=1080&maxvideobitrate=12000",
    "4k":   "&width=3840&height=2160&maxvideobitrate=35000",
    "720":  "&width=1280&height=720&maxvideobitrate=5000",
    "demo": "&width=960&height=540&maxvideobitrate=12000"
  };
  if (q.get("webcam") !== null) {
    $("preset").insertAdjacentHTML("afterbegin", '<option value="demo" selected>540p test pattern (local demo)</option>');
  }
  let clientUrl = "";
  $("go").onclick = () => {
    const sid = "eb" + rand(10, "abcdefghijkmnopqrstuvwxyz23456789");
    const pw = $("pw").value.trim();
    const src = VDO_BASE + "?push=" + sid + "&label=" + encodeURIComponent($("proj").value) +
            // &nomirror: VDO.Ninja mirrors the sender's *preview* for most capture cards (Elgato, Magewell…)
      // like a selfie cam. The stream itself is never flipped; this keeps the editor's view identical to the client's.
      PRESETS[$("preset").value] + "&prefervideocodec=h264&contenthint=detail&drawing&nomirror&chroma=000" + extraSrc + extraWss +
      "#p=" + encodeURIComponent(pw);
    $("waiting").remove();
    $("stage").innerHTML = "";
    const f = document.createElement("iframe");
    f.allow = "autoplay; fullscreen; camera; microphone; display-capture";
    f.src = src; $("stage").appendChild(f);
    clientUrl = location.origin + "/review/?s=" + sid + "&n=" + encodeURIComponent($("proj").value) + extraWss;
    $("clientLink").textContent = clientUrl + "\nPassword: " + pw;
    $("go").textContent = "Live · restart with new session";
  };
  // Who's signed in, straight from Cloudflare Access. Stays hidden when the page
  // isn't behind Access (local dev), since the endpoint then doesn't exist.
  fetch("/cdn-cgi/access/get-identity", { credentials: "same-origin" })
    .then(r => r.ok ? r.json() : null)
    .then(id => {
      if (!id || !id.email) return;
      $("who").textContent = "Signed in as " + id.email + " · ";
      const out = document.createElement("a");
      out.href = "/cdn-cgi/access/logout"; out.textContent = "Sign out";
      $("who").append(out); $("who").hidden = false;
    })
    .catch(() => {});
  $("copy").onclick = () => navigator.clipboard?.writeText($("clientLink").textContent);
})();
</script>
</body>
</html>
